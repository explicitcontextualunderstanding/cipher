version: '3.8'

services:
  cipher-api:
    build: .
    image: cipher-api
    ports:
      - '3001:3000'
    environment:
      - CIPHER_API_PREFIX=""
      # MCP Configuration for GLM-4.6 Compatibility
      - MCP_SERVER_MODE=aggregator
      - MCP_TRANSPORT_TYPE=sse
      - AGGREGATOR_TIMEOUT=120000
      - MCP_GLOBAL_TIMEOUT=120000
      - AGGREGATOR_CONFLICT_RESOLUTION=prefix
      - USE_ASK_CIPHER=true
      # Performance optimizations for GLM-4.6
      - ENABLE_LAZY_LOADING=true
      - CIPHER_LOG_LEVEL=info
      # Node.js server timeout configurations for SSE connections
      - NODE_OPTIONS=--max-http-header-size=16384

      # Google Cloud ADC Configuration
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/cipher-gcp-adc

      # API keys from environment or KeyChain
      - ANTHROPIC_API_KEY_FILE=/run/secrets/cipher-anthropic-api-key
      - OPENAI_API_KEY_FILE=/run/secrets/cipher-openai-api-key
      - OPENROUTER_API_KEY_FILE=/run/secrets/cipher-openrouter-api-key
      - QWEN_API_KEY_FILE=/run/secrets/cipher-qwen-api-key
      - VOYAGE_API_KEY_FILE=/run/secrets/cipher-voyage-api-key
      - DEEPSEEK_API_KEY_FILE=/run/secrets/cipher-deepseek-api-key

      # Static configuration
      - ANTHROPIC_BASE_URL=https://api.z.ai/api/anthropic
      - NODE_ENV=development
      - REDACT_SECRETS=true
      - STORAGE_CACHE_TYPE=in-memory
      - STORAGE_DATABASE_TYPE=in-memory
      - WEB_SEARCH_ENABLE=true
      - WEB_SEARCH_ENGINE=duckduckgo
      - WEB_SEARCH_SAFETY_MODE=strict
      - WEB_SEARCH_MAX_RESULTS=2
      - WEB_SEARCH_RATE_LIMIT=10
      - CIPHER_MULTI_BACKEND=1
      - SEARCH_MEMORY_TYPE=both
      - VECTOR_STORE_TYPE=in-memory
      - VECTOR_STORE_COLLECTION=knowledge_memory
      - VECTOR_STORE_DIMENSION=1536
      - VECTOR_STORE_DISTANCE=Cosine
      - VECTOR_STORE_ON_DISK=false
      - REFLECTION_VECTOR_STORE_COLLECTION=reflection_memory
      - DISABLE_REFLECTION_MEMORY=false
      - ENABLE_QUERY_REFINEMENT=true
    command:
      [
        'sh',
        '-c',
        'NODE_OPTIONS="--max-http-header-size=16384" node dist/src/app/index.cjs --mode api --port 3000 --host 0.0.0.0 --agent /app/memAgent/cipher.yml --mcp-transport-type sse',
      ]
    volumes:
      - ./memAgent:/app/memAgent:ro
      - cipher-data:/app/.cipher
    secrets:
      - cipher-gcp-adc
      - cipher-anthropic-api-key
      - cipher-openai-api-key
      - cipher-openrouter-api-key
      - cipher-qwen-api-key
      - cipher-voyage-api-key
      - cipher-deepseek-api-key
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cipher-data: