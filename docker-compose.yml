version: "3.8"

services:
  cipher-api:
    build: .
    image: cipher-api
    ports:
      - '3000:3000'
    environment:
      - CIPHER_API_PREFIX=""
      - CIPHER_LOG_LEVEL=debug
      - MCP_SERVER_MODE=aggregator
      - MCP_TRANSPORT_TYPE=sse
      - GEMINI_API_KEY_FILE=/run/secrets/cipher-gemini-api-key
      - ANTHROPIC_API_KEY_FILE=/run/secrets/cipher-zai-api-key
    env_file:
      - .env
    command:
      [
        'sh', '-c', 'node dist/src/app/index.cjs --mode api --port $$PORT --host 0.0.0.0 --agent $$CONFIG_FILE --mcp-transport-type $$MCP_TRANSPORT_TYPE'
      ]
    volumes:
      - ./memAgent:/app/memAgent:ro
      - ./scripts/run/load-secret.sh:/tmp/load-secret.sh:ro
      - cipher-data:/app/.cipher
    # podman-compose does not support `target` mapping for secrets; use
    # the simple list form so the secret is mounted by its name into
    # /run/secrets/<secret-name> inside the container.
    secrets:
      - cipher-gemini-api-key
      - cipher-zai-api-key
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

secrets:
  cipher-gemini-api-key:
    external: true
  cipher-zai-api-key:
    external: true

volumes:
  cipher-data:
